name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # release.yml runs the same checks before it builds

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test all Go packages (race detector)
        run: go test -race ./...
      - name: Engine process-hardening self-check
        run: go build -o /tmp/kodeblue-engine ./cmd/kodeblue-engine && /tmp/kodeblue-engine -selfcheck-harden
      - name: Hub image Go is at least go.mod's
        run: |
          want=$(awk '$1 == "go" {print $2}' go.mod)
          have=$(sed -nE 's/^FROM .*golang:([0-9.]+)-.*/\1/p' deploy/hub/Dockerfile)
          if [ -z "$have" ] || [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -1)" != "$want" ]; then
            echo "::error file=deploy/hub/Dockerfile::golang:$have is older than go $want in go.mod; the image build would fail"; exit 1
          fi
      - name: Check installer and release scripts
        run: |
          for f in deploy/install.sh deploy/build-dist.sh deploy/hub/install-hub.sh deploy/e2e/*.sh; do sh -n "$f"; done
          shellcheck -S warning deploy/install.sh deploy/build-dist.sh deploy/hub/install-hub.sh
          node --check internal/hub/web/app.js
          node --check internal/hub/web/warroom.js
      - name: Build kodeblue release (agent tarballs for amd64/arm64 + hub bundles)
        run: sh deploy/build-dist.sh /tmp/dist && ls -la /tmp/dist /tmp/dist/agent && (cd /tmp/dist/agent && sha256sum -c SHA256SUMS)
